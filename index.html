<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Бот-Эзотерик</title>
    <style>
        /* Стили для карт и анимации */
        .card {
            width: 100px;
            height: 150px;
            margin: 10px;
            display: inline-block;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 8px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 8px;
        }

        .card-back {
            background-color: #fff;
            transform: rotateY(180deg);
        }

        #selected-cards {
            margin-top: 20px;
        }

        #continue-button {
            margin-top: 20px;
            padding: 10px 20px;
            display: none;
        }
    </style>
</head>
<body>
    <h1>Выберите 3 карты</h1>
    <div id="cards-container">
        <!-- Пример карт -->
        <div class="card" data-card="Семерка Жезлов">
            <div class="card-inner">
                <div class="card-front">🃏</div>
                <div class="card-back">Семерка Жезлов</div>
            </div>
        </div>
        <div class="card" data-card="Отшельник">
            <div class="card-inner">
                <div class="card-front">🃏</div>
                <div class="card-back">Отшельник</div>
            </div>
        </div>
        <div class="card" data-card="Восьмерка Мечей">
            <div class="card-inner">
                <div class="card-front">🃏</div>
                <div class="card-back">Восьмерка Мечей</div>
            </div>
        </div>
        <!-- Добавьте больше карт по необходимости -->
    </div>
    <div id="selected-cards">
        <h2>Выбранные карты:</h2>
        <ul id="cards-list"></ul>
    </div>
    <button id="continue-button">Продолжить</button>

    <script>
        const maxSelection = 3;
        let selectedCards = [];

        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', () => {
                if (selectedCards.length >= maxSelection && !card.classList.contains('flipped')) {
                    alert(`Вы можете выбрать только ${maxSelection} карты.`);
                    return;
                }
                card.classList.toggle('flipped');
                const cardName = card.getAttribute('data-card');
                if (selectedCards.includes(cardName)) {
                    selectedCards = selectedCards.filter(name => name !== cardName);
                } else {
                    selectedCards.push(cardName);
                }
                updateSelectedCards();
                if (selectedCards.length === maxSelection) {
                    document.getElementById('continue-button').style.display = 'block';
                    // Отправка данных в бот
                    sendDataToBot();
                }
            });
        });

        function updateSelectedCards() {
            const list = document.getElementById('cards-list');
            list.innerHTML = '';
            selectedCards.forEach(card => {
                const li = document.createElement('li');
                li.textContent = card;
                list.appendChild(li);
            });
        }

        function sendDataToBot() {
            // Используем Telegram Web Apps API для отправки данных обратно в бот
            if (window.Telegram.WebApp) {
                const data = {
                    selected_cards: selectedCards
                };
                Telegram.WebApp.sendData(JSON.stringify(data));
            }
        }

        document.getElementById('continue-button').addEventListener('click', () => {
            window.Telegram.WebApp.close();
        });

        // Автоматическое закрытие через 15 секунд
        setTimeout(() => {
            window.Telegram.WebApp.close();
        }, 150000);
    </script>
</body>
</html>
